:root{
  --bg:#F4EFE6; --surface:#FFFCF6; --raise:#FFFFFF; --sunk:#EAE3D6; --fg:#1D1922; --fg2:#4A4351; --muted:#756C7E; --line:#DDD4C5; --line2:#CFC4B2;

  --der:#2F64B5; --die:#C23B3B; --das:#2A8A55;
  --good:#2E7D4F; --good-soft:#DCEFE3; --bad:#B3261E; --bad-soft:#F7DCD9; --warn:#B7791F;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Source Serif 4',Georgia,serif; --ui:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',Menlo,Consolas,monospace; --frak:'UnifrakturMaguntia','Fraunces',Georgia,serif;
  --r:14px; --r-s:10px; --shadow:0 1px 2px rgba(29,25,34,.05),0 12px 28px -18px rgba(29,25,34,.35); --shadow-s:0 1px 2px rgba(29,25,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121017; --surface:#1B1822; --raise:#221E2A; --sunk:#29242F; --fg:#EEE8DD; --fg2:#CFC7D6; --muted:#A39BAD; --line:#332D3C; --line2:#433B4E;
  --accent:#F08A3F; --accent-2:#F6A465; --accent-ink:#2A1607; --accent-soft:#3F2515; --accent-tint:#2A1C14;
  --klinik:#5CB6C6; --klinik-soft:#173339; --alltag:#A48BE0; --alltag-soft:#2B2340; --gram:#E0708A; --gram-soft:#3A1C25; --read:#62C38B; --read-soft:#1A3326; --lit:#E0A54A; --lit-soft:#3A2A12; --kult:#6CC2BA; --kult-soft:#173331;

  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 30px -18px rgba(0,0,0,.8); --shadow-s:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121017; --surface:#1B1822; --raise:#221E2A; --sunk:#29242F; --fg:#EEE8DD; --fg2:#CFC7D6; --muted:#A39BAD; --line:#332D3C; --line2:#433B4E;
  --accent:#F08A3F; --accent-2:#F6A465; --accent-ink:#2A1607; --accent-soft:#3F2515; --accent-tint:#2A1C14;

*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=checkbox],input[type=range],input[type=radio]{accent-color:var(--accent)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:var(--fs-body);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:2.05rem} h2{font-size:1.45rem} h3{font-size:1.12rem} p{margin:0}
a{color:var(--accent)} b,strong{font-weight:600}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ui{font-family:var(--ui)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums} .muted{color:var(--muted)} .fg2{color:var(--fg2)}
.eyebrow{font-family:var(--ui);font-size:var(--fs-cap);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.en{font-family:var(--ui);font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
.eyebrow .en{margin-left:.45rem}
html.nohints .en{display:none!important}
.g-der{color:var(--der);font-weight:600} .g-die{color:var(--die);font-weight:600} .g-das{color:var(--das);font-weight:600}
/* buttons */
button{font:inherit;font-family:var(--ui);font-size:.95rem;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--raise);color:var(--fg);border-radius:var(--r-s);padding:.6rem 1rem;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;transition:background .15s,border-color .15s,transform .06s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--sunk)} button:active{transform:translateY(1px) scale(.99)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -10px var(--accent)}
button.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
button.ghost{background:transparent;border-color:transparent;color:var(--fg2)} button.ghost:hover{background:var(--sunk)}
button.sm{min-height:40px;padding:.4rem .8rem;font-size:.88rem}
button.icon{min-height:40px;width:40px;padding:0}
button.wide{width:100%}
button:disabled{opacity:.45;cursor:default;transform:none}
input,select,textarea{font:inherit;font-family:var(--ui);font-size:1rem;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:var(--r-s);padding:.6rem .8rem;min-height:44px;width:100%}
textarea{font-family:var(--body);font-size:1.05rem;line-height:1.5;min-height:120px;resize:vertical}
label.f{display:grid;gap:.3rem;font-family:var(--ui);font-weight:600;font-size:.9rem}
label.f small{font-weight:400;color:var(--muted)}
/* layout */
#app{min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:.7rem;padding-block:.55rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-family:var(--frak);font-size:1.55rem;line-height:1;box-shadow:0 6px 14px -8px var(--accent);flex-shrink:0}
.brand{display:flex;align-items:center;gap:.6rem}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-family:var(--ui);font-size:var(--fs-cap);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:.05rem}
.chips{margin-left:auto;display:flex;gap:.4rem;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--ui);font-weight:700;font-size:var(--fs-sm);padding:.3rem .6rem;border-radius:999px;background:var(--sunk);color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.flame{background:var(--accent-soft);color:var(--accent-2)}
.chip svg.i{width:16px;height:16px}
main{max-width:820px;margin:0 auto;padding-block:1.3rem 6.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:.35rem max(8px,env(safe-area-inset-right,0px)) calc(.35rem + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bar button{border:0;background:transparent;border-radius:12px;display:grid;justify-items:center;gap:.15rem;padding:.35rem .2rem;min-height:52px;font-size:var(--fs-cap);font-weight:700;color:var(--muted)}
nav.bar button svg.i{width:23px;height:23px}
nav.bar button.on{color:var(--accent-2)} nav.bar button.on svg.i{stroke-width:2.2}
nav.bar button .dot{position:absolute}
aside.side{display:none}
@media (min-width:900px){
  header.top,nav.bar{display:none}
  aside.side{display:flex;flex-direction:column;gap:1.4rem;position:fixed;top:0;bottom:0;left:0;width:248px;padding:1.4rem 1rem 1.2rem;background:var(--surface);border-right:1px solid var(--line);z-index:15}
  aside.side nav{display:grid;gap:.2rem}
  aside.side nav button{justify-content:flex-start;border:0;background:transparent;color:var(--fg2);padding:.65rem .8rem;font-size:1rem;gap:.7rem}
  aside.side nav button.on{background:var(--accent-tint);color:var(--accent-2)}
  aside.side .weekcard{margin-top:auto}
  main{margin-left:248px;margin-right:0;padding-block:2.2rem 3rem;max-width:none;padding-left:max(40px,calc((100vw - 248px - 820px)/2));padding-right:max(40px,calc((100vw - 248px - 820px)/2))}
}
.view{display:grid;gap:1.1rem;grid-template-columns:minmax(0,1fr)}
.view > *,.stack > *,.fbody .in > *{min-width:0}
.stack{display:grid;gap:1rem} .stack.s{gap:.6rem}
.row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center} .between{justify-content:space-between} .end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr));gap:.7rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.15rem;min-width:0}
.card.raise{box-shadow:var(--shadow);background:var(--raise)}
.card.tint{background:var(--accent-tint);border-color:var(--accent-soft)}
.card.k{background:var(--klinik-soft);border-color:color-mix(in srgb,var(--klinik) 30%,transparent)}
.pill{display:inline-flex;align-items:center;gap:.25rem;font-family:var(--ui);font-size:var(--fs-cap);font-weight:700;padding:.18rem .55rem;border-radius:999px;background:var(--sunk);color:var(--fg2);white-space:nowrap}
.pill.o{background:var(--accent-soft);color:var(--accent-2)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.klinik{background:var(--klinik-soft);color:var(--klinik)} .pill.alltag{background:var(--alltag-soft);color:var(--alltag)} .pill.grammatik{background:var(--gram-soft);color:var(--gram)} .pill.lesen{background:var(--read-soft);color:var(--read)} .pill.literatur{background:var(--lit-soft);color:var(--lit)} .pill.exam{background:var(--accent-soft);color:var(--accent-2)} .pill.kino{background:var(--gram-soft);color:var(--gram)}
.film{display:grid;gap:.45rem;padding:1rem 1.05rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);border-left:5px solid var(--gram)}
.film.med{border-left-color:var(--klinik)} .film.lit{border-left-color:var(--lit)} .film.anf{border-left-color:var(--alltag)}
.film h3{font-size:1.1rem} .film .y{font-family:var(--ui);color:var(--muted);font-size:var(--fs-sm);font-weight:600}
.pill.kultur{background:var(--kult-soft);color:var(--kult)}
.head{display:grid;gap:.35rem}
.head p{max-width:62ch;color:var(--fg2)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:1.4rem 1.3rem 1.25rem;background:radial-gradient(120% 140% at 100% 0%,#F59A4E 0%,var(--accent) 45%,#B9480C 100%);color:#FFF6EE;box-shadow:0 18px 36px -22px var(--accent);display:grid;gap:.9rem}
.hero::after{content:"M";position:absolute;right:-.15em;bottom:-.38em;font-family:var(--frak);font-size:11rem;line-height:1;color:rgba(255,255,255,.09);pointer-events:none}
.hero .eyebrow{color:rgba(255,246,238,.82)}
.hero h1{color:#fff;font-size:1.85rem;max-width:20ch}
.hero p{color:rgba(255,246,238,.92);max-width:46ch}
.hero .go{background:#fff;color:#A9440C;border-color:#fff;min-height:56px;font-size:1.05rem;justify-content:space-between;padding:.7rem 1.1rem;box-shadow:0 10px 22px -14px rgba(0,0,0,.5);position:relative;z-index:1}
.hero .go > span{text-align:left;display:block}
.hero .go small{display:block;font-weight:500;color:#9a5a33;font-size:var(--fs-sm);text-align:left}
.hero .go:hover{background:#FFF4EA}
.ringrow{display:flex;align-items:center;gap:1rem;position:relative;z-index:1}
.ring{width:64px;height:64px;flex-shrink:0}
.ring text{font-family:var(--display);font-weight:600}
/* steps timeline */
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:40px 1fr auto;gap:.8rem;align-items:center;padding:.7rem .2rem;border-top:1px solid var(--line);cursor:pointer;border-radius:var(--r-s);background:transparent;text-align:left;font-family:var(--body);font-size:1rem;width:100%;min-height:60px;border-left:0;border-right:0;border-bottom:0}
.step:first-child{border-top:0}
.step:hover{background:var(--sunk)}
.step .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);color:var(--fg2)}
.step .t b{font-family:var(--ui);font-weight:700;font-size:.98rem;display:block}
.step .t small{display:block;color:var(--muted);font-family:var(--ui);font-size:var(--fs-sm);line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.step .st{font-family:var(--ui);font-size:var(--fs-cap);font-weight:700;color:var(--muted);white-space:nowrap}
.step.done .ic{background:var(--good-soft);color:var(--good)} .step.done .t b{color:var(--muted)}
.step.cur .ic{background:var(--accent);color:#fff;box-shadow:0 6px 14px -8px var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.stat{display:grid;gap:.1rem;text-align:center;padding:.8rem .3rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat b{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.05;color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{font-family:var(--ui);font-size:var(--fs-cap);color:var(--muted);font-weight:600}
.stat.o b{color:var(--accent-2)}
/* segmented */
.seg{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;padding:.15rem;margin:0 -.15rem}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:38px;padding:.35rem .85rem;border-radius:999px;font-size:.88rem;background:var(--surface);color:var(--fg2);border-color:var(--line);white-space:nowrap;flex-shrink:0}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button i{display:inline-block;width:8px;height:8px;border-radius:50%}
/* list rows */
.list{display:grid;gap:.5rem}
.li{display:flex;gap:.85rem;align-items:center;padding:.8rem .95rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%;font-family:var(--body);font-size:1rem;min-height:58px;font-weight:400;justify-content:flex-start}
.li:hover{background:var(--raise);border-color:var(--line2)}
.li .n{font-family:var(--display);color:var(--muted);min-width:1.8ch;font-size:1.05rem;text-align:right}
.li .t{flex:1;min-width:0}
.li .t b{font-family:var(--display);font-weight:600;display:block;font-size:1.04rem;line-height:1.25}
.li .t small{display:block;color:var(--muted);font-family:var(--ui);font-size:var(--fs-sm);line-height:1.35;margin-top:.1rem}
.li .m{display:flex;gap:.35rem;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.li .chev{color:var(--muted)}
/* tiles */
.tile{display:grid;align-content:start;gap:.45rem;padding:1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;min-height:118px;font-weight:400;justify-items:start;position:relative}
.tile:hover{background:var(--raise);box-shadow:var(--shadow-s)}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);color:var(--fg2)}
.tile b{font-family:var(--ui);font-weight:700;font-size:.98rem}
.tile small{font-family:var(--ui);color:var(--muted);font-size:var(--fs-sm);line-height:1.3}
.tile .badge{position:absolute;top:.75rem;right:.75rem}
.tile.big{grid-column:1/-1;min-height:auto;grid-template-columns:auto 1fr auto;align-items:center;background:var(--accent-tint);border-color:var(--accent-soft)}
.tile.big .ic{background:var(--accent);color:#fff}
.tile.tutor .ic{background:var(--klinik-soft);color:var(--klinik)}
html:not(.has-tutor) .need-tutor{display:none!important}
html:not(.no-tutor) .tutor-off{display:none!important}
/* focus layer */
.focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.focus[hidden]{display:none}
.fhead{display:flex;align-items:center;gap:.6rem;padding-block:.55rem;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.fhead .ttl{flex:1;min-width:0;font-family:var(--ui);font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead .ttl small{display:block;font-weight:500;color:var(--muted);font-size:var(--fs-cap)}
.prog{display:flex;gap:4px;padding:.45rem max(12px,env(safe-area-inset-right,0px)) .45rem max(12px,env(safe-area-inset-left,0px));background:var(--surface)}
.prog i{flex:1;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0;width:0;background:var(--accent);border-radius:999px;transition:width .35s}
.prog i.done b{width:100%;background:var(--good)} .prog i.cur b{width:var(--p,8%)}
.fbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fbody .in{max-width:720px;margin:0 auto;padding-block:1.2rem 2rem;grid-template-columns:minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:1rem}
.ffoot{border-top:1px solid var(--line);background:var(--surface);padding:.65rem max(16px,env(safe-area-inset-right,0px)) calc(.65rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* flashcard */
.fc-wrap{perspective:1200px}

.fc .back{transform:rotateY(180deg)}
.fc .w{font-family:var(--display);font-size:2.15rem;font-weight:600;line-height:1.15;text-wrap:balance}
.fc .w.sent{font-size:1.45rem}

.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}

.typed{display:flex;gap:.5rem} .typed input{font-size:1.15rem;font-family:var(--body)}
.verdict{padding:.8rem 1rem;border-radius:var(--r-s);background:var(--sunk);font-size:1rem;display:grid;gap:.35rem}
.verdict.ok{background:var(--good-soft)} .verdict.no{background:var(--bad-soft)}
.d-ok{color:var(--good)} .d-del{color:var(--bad);text-decoration:line-through} .d-ins{color:var(--good);background:var(--good-soft);border-radius:4px;padding:0 .15rem;font-weight:600}
/* quiz */
.q{display:grid;gap:.75rem} .q .stem{font-size:1.18rem;font-family:var(--display);line-height:1.35}
.opts{display:grid;gap:.5rem}
.opts button{justify-content:flex-start;text-align:left;font-family:var(--body);font-weight:400;font-size:1.02rem;padding:.75rem 1rem;min-height:52px;line-height:1.35}
.opts button .k{font-family:var(--ui);font-weight:700;color:var(--muted);font-size:var(--fs-cap);min-width:1.2rem}
.opts button.right{background:var(--good-soft);border-color:var(--good)} .opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{padding:.8rem 1rem;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 var(--r-s) var(--r-s) 0;font-size:.98rem}
/* lesson prose */
.prose{max-width:66ch} .prose p{margin:.65rem 0} .prose ul,.prose ol{margin:.5rem 0 .5rem 1.2rem;padding:0} .prose li{margin:.35rem 0}
.prose table{border-collapse:collapse;font-family:var(--ui);font-size:.92rem;margin:.6rem 0;width:100%}
.prose th,.prose td{border:1px solid var(--line);padding:.4rem .6rem;text-align:left;vertical-align:top}
.prose th{background:var(--sunk);font-weight:700}
.prose .de{font-style:italic} .prose b.g{color:var(--accent-2)}
.prose [data-say]{cursor:pointer;border-bottom:1.5px dotted var(--accent);white-space:nowrap}
.prose pre{white-space:pre-wrap;font-family:var(--mono);font-size:var(--fs-sm);background:var(--sunk);padding:.85rem;border-radius:var(--r-s)}
.tw{overflow-x:auto;max-width:100%}
.tip{border-left:3px solid var(--gram);padding:.65rem .95rem;background:var(--gram-soft);border-radius:0 var(--r-s) var(--r-s) 0;margin:.8rem 0;font-size:.97rem}
/* reader + gloss */
.reader{max-width:64ch;font-size:1.16rem;line-height:1.8}
.reader .para{margin:0 0 1rem} .reader .line{display:block;font-family:var(--display)}
.reader .tr,.dl .tr{font-family:var(--ui);font-size:.92rem;color:var(--muted);line-height:1.45;margin:.15rem 0 .9rem;border-left:2px solid var(--line2);padding-left:.7rem}
.tr[hidden]{display:none!important}
.w{cursor:pointer;border-radius:4px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.w:hover{background:var(--accent-soft)} .w.known{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 45%,transparent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--raise);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -14px 34px -16px rgba(0,0,0,.45);padding:1rem max(16px,env(safe-area-inset-right,0px)) calc(1rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:720px;margin:0 auto;display:grid;gap:.55rem}
.sheet .hw{font-family:var(--display);font-size:1.6rem;font-weight:600}
.sheet[hidden]{display:none}
/* v11: course engine */
.weg{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.lvbars{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.lvb{position:relative;height:26px;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-family:var(--ui);font-weight:700;font-size:var(--fs-cap);color:var(--muted)}
.lvb i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 35%,var(--sunk));z-index:0}.lvb.on i{background:var(--good)}.lvb.cur i{background:var(--accent)}
.lvb b{position:relative;z-index:1}.lvb.on b,.lvb.cur b{color:var(--fg)}
.ph{padding:.5rem .65rem;border-left:3px solid var(--line);margin-bottom:.4rem}.ph.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}.ph small{display:block;color:var(--muted);font-family:var(--ui)}

.pill.lv{font-weight:800}.lv-A1{background:#DCEFE3;color:#1F5C38}.lv-A2{background:#D7ECEF;color:#155B69}.lv-B1{background:#FBE3CF;color:#8A3407}.lv-B2{background:#E8E1F5;color:#4A3580}.lv-C1{background:#F4DDE3;color:#7A1F36}
:root[data-theme="dark"] .lv-A1,.px .lv-A1{background:#1A3326;color:#8fe0b0}:root[data-theme="dark"] .lv-A2,.px .lv-A2{background:#173339;color:#8fd8e6}:root[data-theme="dark"] .lv-B1,.px .lv-B1{background:#3F2515;color:#f7b07a}:root[data-theme="dark"] .lv-B2,.px .lv-B2{background:#2B2340;color:#c9b6f5}:root[data-theme="dark"] .lv-C1,.px .lv-C1{background:#3A1C25;color:#f0a0b4}
.g-ex{padding-left:1.2rem}.g-ex li{margin:.25rem 0}.g-ex small{display:block;color:var(--muted);font-family:var(--ui)}.g-merke{padding:.45rem .65rem;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 8px 8px 0;font-family:var(--ui)}
.gr-line{min-height:48px;padding:.5rem;border:1px dashed var(--line2);border-radius:12px;display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0 .4rem;background:var(--sunk)}
.gr-pool{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.gr-tok{min-height:40px;padding:.3rem .7rem;border-radius:10px;font-family:var(--body);font-size:1.02rem;font-weight:500}.gr-tok.on{background:var(--raise)}.gr-tok.right{border-color:var(--good);background:var(--good-soft)}.gr-tok.wrong{border-color:var(--bad);background:var(--bad-soft)}
.gr-ans{font-family:var(--body);font-weight:600;font-size:1.05rem}
textarea.gr-in{width:100%;min-height:64px;font:inherit;font-size:1.05rem;padding:.6rem .75rem;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--raise);color:var(--fg);margin:.5rem 0}
.kit-hidden-select{position:absolute!important;width:1px!important;height:1px!important;opacity:0;pointer-events:none;overflow:hidden}
.hub-card .f input{width:100%}.hub-line{font-size:var(--fs-sm)}
.ws-row .t{min-width:0}.ws-row .pbar{display:block;width:auto;max-width:200px}.ws-list{max-height:60vh;overflow:auto}
/* hold modes: in app mode German text is not natively selectable (the app owns the long press); in system mode the phone does */
html.hold-app .turn>div:not(.who),html.hold-app .para,html.hold-app .line,html.hold-app .de,html.hold-app .xl-blk,html.hold-app .tch-mt,html.hold-app .xp-de,html.hold-app .reader,html.hold-app .dl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.hold-app .xl-native,html.hold-app .xl-native *{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
html.hold-sys .w,html.hold-sys .turn,html.hold-sys .para,html.hold-sys .line,html.hold-sys .de,html.hold-sys .reader,html.hold-sys .dl{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}

.sheet .in{max-height:min(82vh,760px);overflow-y:auto;overscroll-behavior:contain}

.tch-good{display:grid;gap:.3rem}.tch-good>div{display:flex;gap:.5rem;align-items:flex-start;font-family:var(--ui);font-size:.95rem}.tch-good svg{color:var(--good);flex-shrink:0;margin-top:.15rem;width:18px;height:18px}

.dg u{text-decoration:none;color:var(--accent);font-weight:700;font-size:1.15em}

.dg-verb{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--raise));font-weight:700}

.dg-art{border-color:#7a8cff}.dg-adj{border-color:#3fa47b}.dg-end{border-color:var(--accent);color:var(--accent);font-weight:700}.dg-noun{border-color:var(--fg);font-weight:600}

.tch-say{display:grid;gap:.3rem}.tch-say del{color:var(--bad)}.tch-say ins{color:var(--good);text-decoration:none;font-weight:600}
.tch-merke{margin-top:.5rem;font-family:var(--ui);font-size:.9rem;padding:.4rem .65rem;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 8px 8px 0}
.tch-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.tch-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.tch-frames{margin:.4rem 0;padding-left:1.3rem;display:grid;gap:.25rem;font-size:1rem}

/* dialogue */
.dl{display:grid;gap:.55rem}
.turn{display:grid;gap:.15rem;padding:.65rem .9rem;border-radius:16px 16px 16px 4px;background:var(--sunk);max-width:92%;justify-self:start}
.turn.me{background:var(--klinik-soft);border-radius:16px 16px 4px 16px;justify-self:end}
.turn .who{font-family:var(--ui);font-size:var(--fs-cap);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.turn .who button{min-height:30px;width:30px;padding:0;border:0;background:transparent}
/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:.2rem}
.heat i{display:block;width:100%;min-width:9px;aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--sunk))} .heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--sunk))} .heat i.l3{background:var(--accent)}
.heat i.today{outline:2px solid var(--fg);outline-offset:-1px} .heat i.fut{opacity:.4}
.pbar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden} .pbar i{display:block;height:100%;background:var(--accent);border-radius:999px}

:root[data-ui="gothic"][data-realm="IV"] .card::before{display:none}

:root[data-ui="gothic"] button{border-radius:var(--r-s);background:var(--raise);border-color:var(--line2);font-family:var(--ui)}
:root[data-ui="gothic"] button.primary{background:radial-gradient(120% 140% at 30% 0%,#FFB566 0%,#F08A3F 40%,#C8641F 100%);color:#1A0B03;border-color:#7A2F08;font-weight:700;text-shadow:none}
:root[data-ui="gothic"] button.primary:disabled{filter:grayscale(.7) brightness(.7)}
:root[data-ui="gothic"] button.right,:root[data-ui="gothic"] .opts button.right{background:linear-gradient(180deg,#1F4A2A,#163820)!important;border-color:#6FCF8A!important;color:#E8FFEE!important;opacity:1!important;box-shadow:0 0 0 2px #6FCF8A55,0 0 18px -4px #6FCF8A}
:root[data-ui="gothic"] button.wrong,:root[data-ui="gothic"] .opts button.wrong{background:linear-gradient(180deg,#5A1414,#3A0C0C)!important;border-color:#FF6B5E!important;color:#FFE5E2!important;opacity:1!important;box-shadow:0 0 0 2px #FF6B5E55}
:root[data-ui="gothic"] button.right::after{content:" ✓";font-weight:700}:root[data-ui="gothic"] button.wrong::after{content:" ✗";font-weight:700}
:root[data-ui="gothic"] button.go,:root[data-ui="gothic"] .go{background:radial-gradient(120% 140% at 30% 0%,#FFB566 0%,#F08A3F 40%,#C8641F 100%);color:#1A0B03;border-color:#7A2F08;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 10px 26px -14px #F08A3F}
:root[data-ui="gothic"] .seg button.on,:root[data-ui="gothic"] nav.bar button.on,:root[data-ui="gothic"] aside.side nav button.on{color:var(--accent-2)}
/* hero becomes a candlelit plate */
:root[data-ui="gothic"] .hero{background:radial-gradient(90% 120% at 85% 0%,rgba(240,138,63,.35),transparent 55%),linear-gradient(180deg,var(--realm-tint),var(--surface));border:1px solid var(--line2);color:var(--fg);border-radius:var(--r);box-shadow:var(--glow)}
:root[data-ui="gothic"] .hero::after{content:"☩";font-family:serif;color:rgba(240,138,63,.08)}
:root[data-ui="gothic"] .hero .eyebrow{color:var(--accent-2)}
:root[data-ui="gothic"] .hero .go{background:radial-gradient(120% 140% at 30% 0%,#FFB566 0%,#F08A3F 40%,#C8641F 100%);color:#1A0B03;border-color:#7A2F08}
:root[data-ui="gothic"] .hero .go small{color:#4A1F05}
/* chrome */
:root[data-ui="gothic"] header.top{background:linear-gradient(180deg,var(--bg),rgba(0,0,0,0));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
:root[data-ui="gothic"] nav.bar{background:linear-gradient(0deg,var(--bg) 60%,rgba(0,0,0,.6));border-top:1px solid var(--line2)}
:root[data-ui="gothic"] aside.side{background:linear-gradient(180deg,var(--surface),var(--bg));border-right:1px solid var(--line2)}
:root[data-ui="gothic"] .mark{background:none!important;color:var(--accent)!important;font-family:var(--display)!important;font-size:2rem!important;box-shadow:none!important;text-shadow:0 0 18px rgba(240,138,63,.6)}
:root[data-ui="gothic"] .brand b{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.02em}
:root[data-ui="gothic"] .pbar{background:var(--sunk);border:1px solid var(--line)}
:root[data-ui="gothic"] .pbar i{background:linear-gradient(90deg,#7A2F08,#F08A3F,#FFD08A);box-shadow:0 0 12px rgba(240,138,63,.55)}
:root[data-ui="gothic"] .chip{background:var(--sunk);border:1px solid var(--line2);color:var(--fg2)}
:root[data-ui="gothic"] .toast{background:#0B0605;border:1px solid var(--accent);color:var(--fg);font-family:var(--f-ui);box-shadow:var(--glow)}
:root[data-ui="gothic"] .focus{background:var(--bg)}
:root[data-ui="gothic"] input,:root[data-ui="gothic"] textarea,:root[data-ui="gothic"] select{background:var(--sunk);color:var(--fg);border-color:var(--field-line)}
:root[data-ui="gothic"] .fc .face{background:linear-gradient(180deg,var(--raise),var(--sunk))}
/* ========== Pakt components ========== */
.pk-art{position:relative;margin:0;overflow:hidden;border-radius:var(--r);background:#000;isolation:isolate}
.pk-art{display:flex;justify-content:center;background:radial-gradient(circle,#1a1210,#000)}
.pk-art img{display:block;width:100%;height:auto;max-height:52vh;object-fit:cover;object-position:center 30%}
:root[data-ui="gothic"] button:disabled{opacity:.5;border-style:dashed}
.seg{overflow-x:auto;scrollbar-width:thin}
.pk-soul .meter b{display:none}
.pk-art.k-ink img{filter:invert(1) sepia(.55) saturate(1.3) hue-rotate(-12deg) brightness(.92) contrast(1.1)}
.pk-art.k-tone img{filter:sepia(.55) contrast(1.15) brightness(.82)}
.pk-art.k-color img{filter:sepia(.25) contrast(1.05) brightness(.85) saturate(.9)}
:root:not([data-ui="gothic"]) .pk-art.k-ink img{filter:none}
.pk-art::after{content:"";position:absolute;inset:0;background:radial-gradient(110% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.7));pointer-events:none}
:root:not([data-ui="gothic"]) .pk-art::after{display:none}
.pk-art figcaption{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:.6rem .8rem;font-family:var(--ui);font-size:var(--fs-cap);color:rgba(255,240,220,.75);background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)}
.pk-art figcaption b{font-family:var(--body);font-weight:600;font-size:var(--fs-sm);color:#F6E7D2;display:block}
.pk-faust{font-family:var(--body);font-style:italic;font-size:1.12rem;line-height:1.45;border-left:2px solid var(--accent);padding:.2rem 0 .2rem .9rem;white-space:pre-line}
.pk-faust small{display:block;font-style:normal;font-family:var(--ui);font-size:var(--fs-cap);color:var(--muted);margin-top:.35rem;white-space:normal}
.pk-say{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start}
.pk-say .who{width:46px;height:46px;border-radius:50%;overflow:hidden;border:1px solid var(--accent);box-shadow:0 0 16px -4px var(--accent);background:#000;flex-shrink:0}
.pk-say .who img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:invert(1) sepia(.6) hue-rotate(-15deg) contrast(1.2)}
:root:not([data-ui="gothic"]) .pk-say .who img{filter:none}
.pk-say .de{font-family:var(--body);font-size:1.12rem;line-height:1.4}
.pk-say .en{font-family:var(--ui);font-size:var(--fs-sm);color:var(--muted);margin-top:.2rem}
.pk-say .who.n{border-color:var(--line2);box-shadow:none;display:grid;place-items:center;font-family:var(--display);color:var(--muted);font-size:1.4rem}
.pk-say .who.secret{border-style:dashed}
.pk-nar{font-family:var(--body);font-size:1.06rem;line-height:1.55;color:var(--fg2)}
.pk-soul{display:grid;gap:.35rem}
.pk-soul .meter{position:relative;height:14px;border-radius:999px;background:var(--sunk);border:1px solid var(--line2);overflow:hidden}
.pk-soul .meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3A0B0B,#B3261E 35%,#F08A3F 75%,#FFE2B0);box-shadow:0 0 14px rgba(240,138,63,.7)}
.pk-soul .meter b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ui);font-size:var(--fs-cap);letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px #000}
.pk-debt{display:flex;flex-wrap:wrap;gap:.3rem}
.pk-debt i{width:18px;height:24px;background:linear-gradient(180deg,#E9D9B8,#B9A57E);clip-path:polygon(0 0,100% 0,100% 85%,50% 100%,0 85%);position:relative}
.pk-debt i::after{content:"";position:absolute;left:5px;top:8px;width:8px;height:8px;border-radius:50%;background:#8B1A14}
/* realm map */
.pk-map{display:grid;gap:1.1rem;position:relative}
.pk-realm{position:relative;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;min-height:150px;display:grid;align-content:end;background:#000}
.pk-realm>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}
.pk-realm.k-ink>img{filter:invert(1) sepia(.6) hue-rotate(-12deg)}
.pk-realm.k-tone>img{filter:sepia(.6) brightness(.85)}
.pk-realm.k-color>img{filter:sepia(.35) brightness(.8)}
:root:not([data-ui="gothic"]) .pk-realm>img{opacity:.25}
.pk-realm .in{position:relative;padding:1rem;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.25) 70%,transparent);color:#F1E6D3}
.pk-realm .num{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--accent)}
.pk-realm h3{font-family:var(--display)!important;font-weight:400!important;font-size:1.45rem!important;color:#F6EBDA}
.pk-realm.locked{filter:grayscale(1) brightness(.6)}
.pk-realm.here{border-color:var(--accent);box-shadow:var(--glow)}
.pk-chaps{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.pk-chaps button{min-height:34px;min-width:34px;padding:.2rem .45rem;font-family:var(--display);font-size:1rem;background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.18);color:#E9DCC6}
.pk-chaps button.done{background:rgba(240,138,63,.18);border-color:rgba(240,138,63,.55);color:#FFD9B0}
.pk-chaps button.cur{background:#F08A3F;color:#1A0B03;border-color:#FFB566;box-shadow:0 0 14px rgba(240,138,63,.8)}
.pk-chaps button.boss{border-style:double;border-width:3px}
.pk-chaps button:disabled{opacity:.45}
/* pact signing */
.pk-sign{position:relative;border:1px dashed var(--accent);border-radius:var(--r);background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(240,138,63,.12) 31px 32px),var(--sunk);touch-action:none}
.pk-sign canvas{display:block;width:100%;height:150px}
.pk-sign .hint{position:absolute;left:.8rem;bottom:.5rem;font-family:var(--sc);font-size:var(--fs-cap);color:var(--muted);pointer-events:none}
.pk-prolog{max-width:640px;margin:0 auto;display:grid;gap:1.1rem}
.pk-prolog .big{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.05;text-align:center;color:var(--accent-2);text-shadow:0 0 30px rgba(240,138,63,.45)}
.pk-fade{animation:pkFade 1.1s ease both}
@keyframes pkFade{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
:root.nomotion .pk-fade{animation:none}
.pk-flicker{animation:pkFlick 4.5s infinite}
@keyframes pkFlick{0%,100%{opacity:1}43%{opacity:.86}45%{opacity:1}71%{opacity:.92}72%{opacity:.8}74%{opacity:1}}
:root.nomotion .pk-flicker{animation:none}
.pk-np{display:flex;align-items:center;gap:.5rem;font-family:var(--ui);font-size:var(--fs-cap);color:var(--muted);min-width:0}
.pk-np span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pk-mute{min-height:36px;min-width:36px;padding:.2rem .5rem;border-radius:999px}
/* noun gender sigils (used everywhere a der/die/das appears in .gs) */
.g-der,.g-die,.g-das{font-weight:700}
.g-der{color:var(--der)} .g-die{color:var(--die)} .g-das{color:var(--das)}
.sig{display:inline-block;width:.62em;height:.62em;margin-right:.25em;vertical-align:.05em;background:currentColor}
.sig.der{clip-path:polygon(50% 0,100% 100%,0 100%)} .sig.die{border-radius:50%} .sig.das{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
/* desktop: right rail with Mephisto, soul and music (≥1440 px) */
#pakt-rail{display:none}
@media (min-width:1440px){
  :root[data-ui="gothic"] #pakt-rail,:root[data-rail="on"] #pakt-rail{display:grid;position:fixed;top:0;right:0;bottom:0;width:320px;padding:1.4rem 1.1rem;gap:1rem;align-content:start;overflow:auto;border-left:1px solid var(--line2);background:linear-gradient(180deg,var(--surface),var(--bg));z-index:15}
  :root[data-ui="gothic"] main{margin-right:320px;padding-right:max(40px,calc((100vw - 248px - 320px - 860px)/2));padding-left:max(40px,calc((100vw - 248px - 320px - 860px)/2))}
}
/* phone heading size: --fs-h1 (s_a1.css) */
/* gamepad / keyboard focus ring */
:root[data-ui="gothic"] :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* five tabs */
nav.bar{grid-template-columns:repeat(5,minmax(0,1fr))!important}
nav.bar button span{white-space:nowrap}
/* Mephisto's face from Clarke's plate */
.pk-say .who img{width:330%;height:auto;max-width:none;object-fit:initial;transform:translate(-35%,-1%)}

/* =====================================================================================================================
   s_a1.css — Mephisto design tokens and type system (a1, PLAN-A §2.1–2.6). Loaded right after g_gothic.css
   (modules.json "styles"). Every other track-A package CONSUMES these tokens; values are set only here.
   Sources: A7-typography §6.1 (type, renamed --t-* → --fs-*), artsound §4.1 + A5 P1 (colour), ux D19–D24 / P10
   (contrast, space, targets), A6 §5.1 (motion tokens; the calm collapse lives in head.html), A8 §4 (scrims).
   Specificity note: the style blocks that c_*.js inject go into <head>; this sheet is inlined after them in the
   page, so equal specificity wins here. Rules that must beat c_learn5.js's !important use the html:root[data-ui] prefix.
   Nothing here sets a font-size below 13 px (tests/typo.js checks).
   ===================================================================================================================== */

/* ---------- 0. Faces (assets/media/fonts → out/media/fonts; built by tools/build_fonts.py; licences in a1-fonts.json) ---------- */
@font-face{font-family:"Mephisto Lern";src:url(media/fonts/a1-learn.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Mephisto Lern";src:url(media/fonts/a1-learn-it.woff2) format("woff2");font-weight:400 700;font-style:italic;font-display:swap}
@font-face{font-family:"Mephisto UI";src:url(media/fonts/a1-ui.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Mephisto UI";src:url(media/fonts/a1-ui-it.woff2) format("woff2");font-weight:400 700;font-style:italic;font-display:swap}
@font-face{font-family:"Mephisto Garamond";src:url(media/fonts/a1-garamond.woff2) format("woff2");font-weight:400 800;font-style:normal;font-display:swap}
@font-face{font-family:"Mephisto Garamond";src:url(media/fonts/a1-garamond-it.woff2) format("woff2");font-weight:400 800;font-style:italic;font-display:swap}
@font-face{font-family:"Mephisto Fell";src:url(media/fonts/a1-fell.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Mephisto Fell";src:url(media/fonts/a1-fell-it.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Mephisto Gotisch";src:url(media/fonts/a1-gotisch.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Mephisto Fraktur";src:url(media/fonts/a1-fraktur.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mephisto Feder";src:url(media/fonts/a1-feder.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mephisto Germania";src:url(media/fonts/a1-germania.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mephisto Pirat";src:url(media/fonts/a1-pirat.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mephisto Neu";src:url(media/fonts/a1-neu.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Mephisto Dokument";src:url(media/fonts/a1-doc.woff2) format("woff2");font-weight:400;font-display:swap}
/* companion digit faces (A7 §6.2): lining 0–9 placed first in every stack whose face has old-style figures */
@font-face{font-family:"Mephisto Ziffern";src:url(media/fonts/a1-ziffern.woff2) format("woff2");font-weight:400 800;font-style:normal;unicode-range:U+0030-0039;font-display:block}
@font-face{font-family:"Mephisto Ziffern";src:url(media/fonts/a1-ziffern-it.woff2) format("woff2");font-weight:400 800;font-style:italic;unicode-range:U+0030-0039;font-display:block}
@font-face{font-family:"Mephisto Ziffern Titel";src:url(media/fonts/a1-ziffern-titel.woff2) format("woff2");font-weight:400 700;unicode-range:U+0030-0039;font-display:block}

/* ---------- 1. Root scaling: one knob for the viewport (--vp), one for the Textgröße slider (--ts, written by c_pixel.js) ----------
   Layout breakpoints (fixed here; html[data-layout] is set by a8): phone <600 · tablet 600–1099 · deck 1100–1599 · desk ≥1600 */
html{font-size:calc(100% * var(--vp,1) * var(--ts,1));-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--vp:1;--ts:1}
@media (min-width:600px){:root{--vp:1.0625}}
@media (min-width:1100px){:root{--vp:1.125}}
@media (min-width:1600px){:root{--vp:1.25}}
@media (min-width:2200px){:root{--vp:1.3125}}

/* ---------- 2. Tokens shared by every look ---------- */
:root{
  /* 2.2 faces by role (looks and realms override --f-display, --f-read, --f-sc) */
  --f-ui:"Mephisto UI","Source Sans 3","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --f-learn:"Mephisto Lern","Source Serif 4","Mephisto Garamond","EB Garamond",Georgia,"Noto Serif",serif;
  --f-read:var(--f-learn);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-sc:var(--f-ui);
  --f-num:"Mephisto UI","Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-doc:"Mephisto Dokument","Special Elite","Courier New",ui-monospace,monospace;
  --f-frak:"Mephisto Ziffern Titel","Mephisto Fraktur","Unifraktur Maguntia","UnifrakturMaguntia","Mephisto Garamond",serif;
  --f-initial:var(--f-display);
  /* 2.2 sizes (rem; px = rem × root: 16 phone · 17 tablet · 18 Deck · 20 1920 · 21 2560) */
  --fs-cap:.8125rem;  --fs-sm:.875rem;  --fs-ui:.9375rem; --fs-body:1.0625rem; --fs-read:1.125rem; --fs-lead:1.25rem;
  --fs-h2:1.5rem;     --fs-h1:1.875rem; --fs-word:2.125rem; --fs-disp:2.25rem;  --fs-num:2.625rem;
  --lh-tight:1.12; --lh-head:1.2; --lh-ui:1.35; --lh-body:1.55; --lh-read:1.62;
  --ls-caps:.08em;
  --measure:31em; --measure-ui:38em;
  /* 2.3 space, radius, targets, layout */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
  --card-pad:var(--sp-4); --gutter:16px;
  --r-l:14px;
  --tap:44px; --tap-1:48px; --tap-gap:8px;
  --rail-w:248px; --stage-max:1760px; --col-read:46rem;
  /* 2.4 motion (values; the rules are a7's; calm collapse in head.html) */
  --t-1:90ms; --t-2:180ms; --t-3:320ms; --t-4:560ms; --t-5:1200ms;
  --e-out:cubic-bezier(.16,.84,.24,1); --e-in:cubic-bezier(.5,0,.9,.4); --e-inout:cubic-bezier(.62,.04,.26,1);
  --e-stamp:cubic-bezier(.3,1.32,.5,1); --e-lin:linear;
  --d-1:4px; --d-2:8px; --d-3:16px; --d-4:32px; --stagger:40ms; --s-in:.97; --s-stamp:1.18;
  /* 2.5 layers (one table; nobody invents a level) */
  --z-scene:0; --z-fx-back:1; --z-gutter:14; --z-side:15; --z-top:20; --z-eye:31; --z-focus:40; --z-whisper:56; --z-fx-front:59;
  --z-sheet:60; --z-kit:70; --z-toast:80; --z-snack:85; --z-slip:88; --z-cine:90; --z-fx-over:96;
  /* 2.1 colour roles that every look has (Clean / Pixel values; Paper and Gothic override below) */
  --accent-text:var(--accent);
  --field-line:color-mix(in srgb,var(--fg) 45%,var(--surface));
  --focus-ring:3px solid var(--accent); --focus-halo:0 0 0 5px var(--bg);
  --scrim:var(--bg); --scrim-fg:.78; --scrim-muted:.88;
  --btn-ink:#2A1607;
  --second:var(--accent); --light:#F08A3F; --sky-top:var(--bg); --sky-low:var(--surface);
  --plate-ink:#060606; --plate-paper:#DEDCD4; --duo:url(#duo-IV);
}
@media (min-width:600px){:root{--gutter:24px}}
@media (min-width:900px){:root{--card-pad:var(--sp-5)}}
@media (min-width:1600px){:root{--gutter:32px}}

/* ---------- 2.1 colour per look and realm ---------- */
:root[data-ui="paper"]{--field-line:color-mix(in srgb,var(--fg) 52%,var(--surface));   /* 45 % gives 2.86:1 on Paper; 52 % ≥ 3.3:1 */
  --muted:#685F72;--das:#1F7446;--accent-text:#A8430A;--btn-ink:#2A1607;--second:#685F72;--light:#B86A1E;--plate-ink:#241610;--plate-paper:#EFE5CF;--duo:url(#duo-paper)}
:root[data-ui="clean"]{--btn-ink:#2A1607}

<script>

/* ---------- hold menus ---------- */

function sheet(title,sub,items,extra){closeKit();const w=document.createElement("div");w.innerHTML=`<div class="kit-scrim"></div><div class="kit-sheet" role="dialog" aria-label="${esc(title)}"><div class="in"><div class="grab"></div><h4>${esc(title)}</h4>${sub?`<div class="sub">${esc(sub)}</div>`:""}${extra||""}${items.map((x,i)=>`<button class="it ${x.danger?"danger":""}" data-kit="${i}" ${x.disabled?"disabled":""}>${x.icon?ic(x.icon):""}<span>${esc(x.label)}${x.hint?`<small>${esc(x.hint)}</small>`:""}</span></button>`).join("")}<button class="cancel ghost" data-kit="x">Abbrechen</button></div></div>`;
  document.body.appendChild(w);sheetEl=w;w.querySelector(".kit-scrim").onclick=closeKit;

  return w}

function stepMenu(btn){const T=S.today;if(!T)return;const i=+btn.dataset.i;const s=T.steps[i];if(!s)return;const inf=stepInfo(s);
  sheet(inf.name,inf.sub,[
    {label:s.done?"Nochmal öffnen":"Jetzt öffnen",icon:"play",run:()=>openSession(i)},
    s.done?{label:"Als offen markieren",hint:"Schritt erscheint wieder als „jetzt“",icon:"back",run:()=>{s.done=false;s.skipped=false;saveSoon();rerender();toast("Wieder offen")}}
          :{label:"Als erledigt markieren",hint:"Z. B. wenn du es offline gemacht hast",icon:"check",run:()=>{s.done=true;saveSoon();rerender();toast("Erledigt")}},
    {label:"Heute überspringen",icon:"x",disabled:s.done,run:()=>{s.done=true;s.skipped=true;saveSoon();rerender();toast("Übersprungen")}}])}
function minutesSheet(){const opts=[30,45,60,90,120];let v=Math.max(0,opts.indexOf(S.minutes));
  const w=sheet("Sitzungslänge","Wie viel Zeit hast du heute? Ändert die Schritte, solange noch keiner erledigt ist.",[{label:"Übernehmen und starten",icon:"play",run:()=>{apply();openSession()}},{label:"Nur übernehmen",icon:"check",run:()=>apply()}],
   `<div class="kit-slide"><b class="ui kit-min" style="font-size:1.6rem;text-align:center">${opts[v]} Min.</b><input type="range" class="kit-range" min="0" max="${opts.length-1}" step="1" value="${v}" aria-label="Minuten pro Tag"><div class="ticks">${opts.map((o,i)=>`<span class="${i===v?"on":""}">${o}</span>`).join("")}</div><small class="muted ui kit-min-sub" style="text-align:center"></small></div>`);

  const upd=()=>{v=+r.value;r.style.setProperty("--pct",100*v/(opts.length-1)+"%");lab.textContent=opts[v]+" Min.";sub.textContent=desc(opts[v]);w.querySelectorAll(".ticks span").forEach((s,i)=>s.classList.toggle("on",i===v));vib(5)};r.oninput=upd;upd();
  function apply(){S.minutes=opts[v];saveSoon();rerender();toast("Sitzung: "+opts[v]+" Minuten")}}
function lessonMenu(row){const id=(row.dataset.arg||"").slice(3);const L=typeof lessonById==="function"?lessonById(id):null;const t=(row.querySelector(".t b")||{}).textContent||"";

  const F=(typeof FAUST!=="undefined"&&FAUST.find(x=>x.id===id))||(typeof POEMS!=="undefined"&&POEMS.find(x=>x.id===id));
  if(F&&F.lines)items.push({label:"Schattensprechen",hint:"Verse nachsprechen",icon:"wave",run:()=>ACT.shadowFaust({dataset:{id}})});

  sheet(t||"Lektion",(row.querySelector(".t small")||{}).textContent||"",items)}

/* which hold does what */
function holdAction(t){

  const step=t.closest(".step[data-act=openStep]");if(step)return ()=>stepMenu(step);

  const wrow=t.closest(".li");if(wrow&&wrow.querySelector("[data-say]")&&!t.closest("button"))return ()=>wordMenu(wrow);

  return null}

/* ---------- one gesture engine: hold to explain or open a menu ---------- */
let tipEl=null,timer=null,start=null,swallow=false,held=null;
function showTip(target,html){hideTip();tipEl=document.createElement("div");tipEl.className="kit-tip";tipEl.setAttribute("role","tooltip");tipEl.innerHTML=html;document.body.appendChild(tipEl);
  const r=target.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;let x=r.left+r.width/2-w/2;x=Math.max(16,Math.min(innerWidth-16-w,x));let y=r.top-h-10;if(y<12)y=r.bottom+10;tipEl.style.left=x+"px";tipEl.style.top=y+"px";requestAnimationFrame(()=>tipEl&&tipEl.classList.add("show"));vib(8)}
function hideTip(){if(tipEl){tipEl.remove();tipEl=null}}

document.addEventListener("pointerdown",e=>{if(e.button>0)return;hideTip();clear();const t=e.target;if(t.closest("input,textarea,select,.kit-tip"))return;if(window.xlOwns&&window.xlOwns(t))return;
  start={x:e.clientX,y:e.clientY};const act=holdAction(t);const html=act?null:hintFor(t);if(!act&&!html)return;

/* ---------- swipe the flashcard ---------- */
const SW={left:[0,"Nochmal","var(--bad)"],down:[1,"Schwer","var(--gram)"],right:[2,"Gut","var(--good)"],up:[3,"Leicht","var(--accent)"]};
let sw=null;
document.addEventListener("pointerdown",e=>{const fc=e.target.closest(".fc");if(!fc||fc.style.cursor==="default"||e.button>0)return;const wrap=fc.closest(".fc-wrap");sw={x:e.clientX,y:e.clientY,wrap,fc,dir:null,moved:false};},{passive:true});
document.addEventListener("pointermove",e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(!sw.moved&&Math.hypot(dx,dy)<14)return;
  if(!sw.moved){sw.moved=true;clear();sw.wrap.classList.add("kit-drag");if(!sw.wrap.querySelector(".kit-swipe-label")){const l=document.createElement("div");l.className="kit-swipe-label";sw.wrap.style.position="relative";sw.wrap.appendChild(l)}}
  const flipped=sw.fc.classList.contains("flip");sw.wrap.style.transform=`translate(${dx}px,${dy*.6}px) rotate(${dx/22}deg)`;
  const ax=Math.abs(dx),ay=Math.abs(dy);sw.dir=Math.max(ax,ay)<70?null:ax>ay?(dx>0?"right":"left"):(dy>0?"down":"up");
  const l=sw.wrap.querySelector(".kit-swipe-label");if(!flipped){l.textContent=sw.dir?"Umdrehen":"";l.style.color="var(--fg2)";l.style.opacity=sw.dir?1:0;return}
  const d=sw.dir&&SW[sw.dir];l.textContent=d?d[1]:"";l.style.color=d?d[2]:"";l.style.opacity=d?1:0},{passive:true});
document.addEventListener("pointerup",()=>{if(!sw)return;const s=sw;sw=null;if(!s.moved)return;swallow=true;setTimeout(()=>swallow=false,350);
  const flipped=s.fc.classList.contains("flip");const reset=()=>{s.wrap.classList.remove("kit-drag");s.wrap.classList.add("kit-back");s.wrap.style.transform="";const l=s.wrap.querySelector(".kit-swipe-label");if(l)l.style.opacity=0;setTimeout(()=>s.wrap.classList.remove("kit-back"),260)};
  if(!s.dir){reset();return}
  if(!flipped){reset();s.fc.click();return}

  if(b){s.wrap.classList.remove("kit-drag");s.wrap.classList.add("kit-back");const k=s.dir==="left"?"-120vw,0":s.dir==="right"?"120vw,0":s.dir==="up"?"0,-100vh":"0,100vh";s.wrap.style.transform=`translate(${k})`;setTimeout(()=>{swallow=false;b.click()},180)}else reset()});

/* ---------- live polish on whatever just rendered ---------- */
function enhance(root){
  // swipe tip under the rating row, until you've swiped 5 times
  const rate=root.querySelector&&root.querySelector(".rate");if(rate&&!rate.nextElementSibling?.classList?.contains("kit-swipe-tip")&&(+lsG("kit_swipes")||0)<5){const p=document.createElement("div");p.className="kit-swipe-tip";p.textContent="Tipp: Karte wischen · ← Nochmal · ↓ Schwer · → Gut · ↑ Leicht";rate.after(p)}

  root.querySelectorAll&&root.querySelectorAll("select.p-min,select.p-new,select.s-max").forEach(sel=>{if(sel.dataset.kit)return;sel.dataset.kit=1;const opts=[...sel.options].map(o=>o.value);const wrap=document.createElement("div");wrap.className="kit-slide";
